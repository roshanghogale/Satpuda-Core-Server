version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: satpuda_core
      POSTGRES_USER: satpuda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satpuda_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U satpuda -d satpuda_core']
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://satpuda:${POSTGRES_PASSWORD:-satpuda_change_me}@db:5432/satpuda_core
    ports:
      - '3000:3000'
    volumes:
      - ./logs:/app/logs

volumes:
  pgdata:
